root: /nas-ctm01/datasets/public/LungNodule-nifti


split:
  validation_fraction: 0.10
  seed: 42
  stratify_by_dataset: true

real:
  train:
    LIDC_IDRI:
      images: preprocessed/train/LIDC_IDRI/ct
      nod_masks: preprocessed/train/LIDC_IDRI/nodulemask
      ts_masks: preprocessed/train/LIDC_IDRI/ts_out

    LNDb:
      images: preprocessed/train/LNDb/ct
      nod_masks: preprocessed/train/LNDb/nodulemask
      ts_masks: preprocessed/train/LNDb/ts_out
      

  test:
    LIDC_IDRI:
      images: preprocessed/test/LIDC_IDRI/ct
      nod_masks: preprocessed/test/LIDC_IDRI/nodulemask
      ts_masks: preprocessed/test/LIDC_IDRI/ts_out

    LNDb:
      images: preprocessed/test/LNDb/ct
      nod_masks: preprocessed/test/LNDb/nodulemask
      ts_masks: preprocessed/test/LNDb/ts_out

synthetic:
  maisi_ct:
    conditioned_on_real: true
    images: preprocessed/MAISI/results_ln_cases/images
    nod_masks: preprocessed/MAISI/results_ln_cases/nodulemask
    ts_masks: preprocessed/MAISI/results_ln_cases/ts_out # Not present on NAS at implementation time.

  maisi_maskct:
    conditioned_on_real: false
    images: preprocessed/MAISI/results_synth_maskct/images
    nod_masks: preprocessed/MAISI/results_synth_maskct/masks # Binary nodule masks.
    ts_masks: preprocessed/MAISI/results_synth_maskct/masks_132

  land:
    conditioned_on_real: true
    images: preprocessed/LAND/results_inf_real/volumes
    nod_masks:
      - preprocessed/LAND/results_inf_real/masks/train/LIDC_IDRI/nodulemask
      - preprocessed/LAND/results_inf_real/masks/train/LNDb/nodulemask
    ts_masks:
      - preprocessed/LAND/results_inf_real/masks/train/LIDC_IDRI/ts_out
      - preprocessed/LAND/results_inf_real/masks/train/LNDb/ts_out

  lungddpm:
    conditioned_on_real: true
    images: preprocessed/LungDDPM/results_inf_real/volumes
    nod_masks:
      - preprocessed/train/LIDC_IDRI/nodulemask
      - preprocessed/train/LNDb/nodulemask
    ts_masks:
      - preprocessed/train/LIDC_IDRI/ts_out
      - preprocessed/train/LNDb/ts_out
