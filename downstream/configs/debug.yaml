# Lightweight training run with checkpoint saving and reporting enabled.
# Batch limits apply to Trainer only; the final report uses all validation cases.
# Input volumes keep their original preprocessed dimensions.

seed: 42
classes: nodule # CLI --classes overrides this setting.

data:
  batch_size: 1
  eval_batch_size: 1
  num_workers: 0
  pin_memory: false
  expected_shape: [256, 256, 128]
  hu_min: -1000
  hu_max: 1000

model:
  spatial_dims: 3
  in_channels: 1
  # out_channels is derived from classes: 1 for nodule, 3 for lung+nodule.
  init_filters: 8
  blocks_down: [1, 1]
  blocks_up: [1]
  dropout_prob: 0.0

loss:
  dice_weight: 1.0
  bce_weight: 1.0 # Binary task.
  ce_weight: 1.0 # Multiclass task; also weights nodule-vs-rest monitoring BCE.

optimizer:
  lr: 0.0001
  weight_decay: 0.00001

early_stop:
  monitor: val_loss_nodule
  mode: min
  patience: 10
  min_delta: 0.001
  verbose: true

trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 2
  limit_train_batches: 4
  limit_val_batches: 4
  num_sanity_val_steps: 0
  log_every_n_steps: 1
  enable_progress_bar: true

checkpoint:
  monitor: val_dice_nodule
  mode: max
  save_top_k: 1
  save_last: true

output_dir: runs/debug