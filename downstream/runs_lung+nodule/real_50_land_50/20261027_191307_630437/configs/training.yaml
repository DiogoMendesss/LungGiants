seed: 42
classes: lung+nodule
data:
  batch_size: 1
  eval_batch_size: 1
  num_workers: 8
  pin_memory: false
  sharing_strategy: file_system
  prefetch_factor: 1
  expected_shape:
  - 256
  - 256
  - 128
  hu_min: -1000
  hu_max: 1000
model:
  spatial_dims: 3
  in_channels: 1
  init_filters: 16
  blocks_down:
  - 1
  - 2
  - 2
  - 4
  blocks_up:
  - 1
  - 1
  - 1
  dropout_prob: 0.2
  out_channels: 3
loss:
  dice_weight: 1.0
  bce_weight: 1.0
  ce_weight: 1.0
optimizer:
  lr: 0.0001
  weight_decay: 1.0e-05
early_stop:
  monitor: val_loss_nodule
  mode: min
  patience: 20
  min_delta: 0.001
  verbose: true
trainer:
  accelerator: gpu
  devices: 1
  precision: 16-mixed
  max_epochs: 300
  log_every_n_steps: 100
  enable_progress_bar: true
checkpoint:
  monitor: val_dice_nodule
  mode: max
  save_top_k: 1
  save_last: true
output_dir: runs
